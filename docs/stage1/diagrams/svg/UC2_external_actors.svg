@startuml UC2_external_actors
skinparam dpi 140
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam defaultFontSize 13
skinparam titleFontSize 18
skinparam titleFontStyle bold
skinparam classAttributeIconSize 0
skinparam roundcorner 8
skinparam ArrowColor #455A64
skinparam ArrowFontSize 11
skinparam ArrowFontColor #37474F
skinparam ArrowThickness 1.2
skinparam nodesep 40
skinparam ranksep 50
skinparam padding 2

skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #546E7A
  HeaderBackgroundColor #ECEFF1
  StereotypeFontSize 11
  StereotypeFontColor #AD1457
  FontStyle bold
  AttributeFontSize 12
}
skinparam class {
  BackgroundColor<<Facade>> #FFF3E0
  BackgroundColor<<Command>> #E8F5E9
  BackgroundColor<<Invoker>> #E8F5E9
  BackgroundColor<<Subject>> #E3F2FD
  BackgroundColor<<Observer>> #E3F2FD
  BackgroundColor<<Strategy>> #F3E5F5
  BackgroundColor<<Context>> #F3E5F5
  BackgroundColor<<Template Method>> #FFFDE7
  BackgroundColor<<State>> #FCE4EC
  BackgroundColor<<Adapter>> #E0F7FA
  BackgroundColor<<Adaptee>> #E0F7FA
  BackgroundColor<<Target>> #E0F7FA
}
skinparam package {
  BorderColor #90A4AE
  BackgroundColor #FCFCFC
  FontStyle bold
  FontSize 14
}
skinparam note {
  BackgroundColor #FFFDE7
  BorderColor #F9A825
  FontSize 12
}
skinparam legend {
  BackgroundColor #FAFAFA
  BorderColor #B0BEC5
  FontSize 12
}

skinparam sequence {
  ParticipantBackgroundColor #FFFFFF
  ParticipantBorderColor #546E7A
  ParticipantFontStyle bold
  ActorBorderColor #546E7A
  ActorBackgroundColor #FFFFFF
  LifeLineBorderColor #B0BEC5
  LifeLineBackgroundColor #ECEFF1
  GroupBorderColor #78909C
  GroupBackgroundColor #ECEFF1
  GroupHeaderFontStyle bold
  BoxBorderColor #CFD8DC
  BoxFontStyle bold
  DividerBackgroundColor #455A64
  DividerFontColor #FFFFFF
  DividerFontStyle bold
}
skinparam maxMessageSize 220
skinparam ParticipantPadding 12
skinparam BoxPadding 8
skinparam responseMessageBelowArrow true

skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1565C0
  FontSize 13
}
skinparam actor {
  BorderColor #37474F
  FontStyle bold
}
skinparam rectangle {
  BorderColor #90A4AE
  FontStyle bold
}
left to right direction
title Use-Case Diagram — View 2: external systems the use cases rely on

rectangle "EventPilot (GUI + CLI)" {
  usecase "UC01 Create event from a description" as UC01
  usecase "UC03 Get venue recommendations" as UC03
  usecase "UC04 Generate agenda" as UC04
  usecase "UC05 Schedule speakers" as UC05
  usecase "UC06 Detect & resolve conflicts" as UC06
  usecase "UC07 Plan & track budget" as UC07
  usecase "UC08 Plan catering" as UC08
  usecase "UC09 Generate & track tasks" as UC09
  usecase "UC11 Ask the FAQ agent" as UC11
  usecase "UC12 Change plan in plain language" as UC12
  usecase "UC10 Draft & send invitations" as UC10
}
actor "LLM Service\n(Claude / Ollama)" as LLM <<external AI>>
actor "Email Gateway\n(outbox folder)" as MAIL <<external system>>

UC01 - -> LLM
UC03 - -> LLM
UC04 - -> LLM
UC05 - -> LLM
UC06 - -> LLM
UC07 - -> LLM
UC08 - -> LLM
UC09 - -> LLM
UC11 - -> LLM
UC12 - -> LLM
UC10 - -> LLM
UC10 - -> MAIL
note bottom of LLM
  UC02, UC13, UC14, UC15 are
  fully deterministic (no AI).
end note
@enduml

