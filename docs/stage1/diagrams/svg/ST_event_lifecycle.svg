,1160.3212 " fill="none" id="Cancelled-*end" style="stroke: #455A64; stroke-width: 1.7499999999999998;"/><polygon fill="#455A64" points="430.325,1165.2066,444.0185,1160.8727,435.784,1160.3726,436.2841,1152.1382,430.325,1165.2066" style="stroke: #455A64; stroke-width: 1.7499999999999998;"/><!--
@startuml ST_event_lifecycle
skinparam dpi 140
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam defaultFontSize 13
skinparam titleFontSize 18
skinparam titleFontStyle bold
skinparam classAttributeIconSize 0
skinparam roundcorner 8
skinparam ArrowColor #455A64
skinparam ArrowFontSize 11
skinparam ArrowFontColor #37474F
skinparam ArrowThickness 1.2
skinparam nodesep 40
skinparam ranksep 50
skinparam padding 2

skinparam class {
  BackgroundColor #FFFFFF
  BorderColor #546E7A
  HeaderBackgroundColor #ECEFF1
  StereotypeFontSize 11
  StereotypeFontColor #AD1457
  FontStyle bold
  AttributeFontSize 12
}
skinparam class {
  BackgroundColor<<Facade>> #FFF3E0
  BackgroundColor<<Command>> #E8F5E9
  BackgroundColor<<Invoker>> #E8F5E9
  BackgroundColor<<Subject>> #E3F2FD
  BackgroundColor<<Observer>> #E3F2FD
  BackgroundColor<<Strategy>> #F3E5F5
  BackgroundColor<<Context>> #F3E5F5
  BackgroundColor<<Template Method>> #FFFDE7
  BackgroundColor<<State>> #FCE4EC
  BackgroundColor<<Adapter>> #E0F7FA
  BackgroundColor<<Adaptee>> #E0F7FA
  BackgroundColor<<Target>> #E0F7FA
}
skinparam package {
  BorderColor #90A4AE
  BackgroundColor #FCFCFC
  FontStyle bold
  FontSize 14
}
skinparam note {
  BackgroundColor #FFFDE7
  BorderColor #F9A825
  FontSize 12
}
skinparam legend {
  BackgroundColor #FAFAFA
  BorderColor #B0BEC5
  FontSize 12
}

skinparam sequence {
  ParticipantBackgroundColor #FFFFFF
  ParticipantBorderColor #546E7A
  ParticipantFontStyle bold
  ActorBorderColor #546E7A
  ActorBackgroundColor #FFFFFF
  LifeLineBorderColor #B0BEC5
  LifeLineBackgroundColor #ECEFF1
  GroupBorderColor #78909C
  GroupBackgroundColor #ECEFF1
  GroupHeaderFontStyle bold
  BoxBorderColor #CFD8DC
  BoxFontStyle bold
  DividerBackgroundColor #455A64
  DividerFontColor #FFFFFF
  DividerFontStyle bold
}
skinparam maxMessageSize 220
skinparam ParticipantPadding 12
skinparam BoxPadding 8
skinparam responseMessageBelowArrow true

skinparam usecase {
  BackgroundColor #E3F2FD
  BorderColor #1565C0
  FontSize 13
}
skinparam actor {
  BorderColor #37474F
  FontStyle bold
}
skinparam rectangle {
  BorderColor #90A4AE
  FontStyle bold
}
title Event Lifecycle — implemented with the State pattern\n<size:13><i>Each box is one EventState class. Arrows are LifecycleActions; [text] is the guard that must be true.</i></size>
skinparam state {
  BackgroundColor #FCE4EC
  BorderColor #AD1457
  FontStyle bold
}
[*] - -> Draft : event created (F01)
state "Draft\n(DraftState)" as Draft : can edit plan\ncannot send invitations
state "Planning\n(PlanningState)" as Planning : can edit plan\ncan send invitations
state "Confirmed\n(ConfirmedState)" as Confirmed : can edit (with warnings)\ncan send invitations
state "Completed\n(CompletedState)" as Completed : read-only
state "Cancelled\n(CancelledState)" as Cancelled : read-only
Draft - -> Planning : START_PLANNING\n[name, date and attendance set]
Planning - -> Confirmed : CONFIRM\n[venue chosen, agenda not empty,\nno HIGH conflicts, within budget]
Confirmed - -> Planning : REOPEN
Confirmed - -> Completed : COMPLETE\n[event date has passed]
Draft - -> Cancelled : CANCEL
Planning - -> Cancelled : CANCEL
Confirmed - -> Cancelled : CANCEL
Completed - -> [*]
Cancelled - -> [*]
@enduml

